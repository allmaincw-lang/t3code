<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="jarvis.css" />
  </head>
  <body>
    <main id="signed-out" class="signed-out">
      <h1>Room</h1>
      <p id="signed-out-text" role="status">Connecting to the room...</p>
    </main>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <strong>Room</strong>
        <span id="status" class="muted" role="status"></span>
        <div class="controls">
          <button id="join-call" class="primary">Join call</button>
          <button id="toggle-mic" hidden aria-pressed="false">Mute</button>
          <button id="toggle-camera" hidden aria-pressed="false">Stop camera</button>
          <button id="share-screen" hidden aria-pressed="false">Share screen</button>
          <button id="leave-call" class="danger" hidden>Leave</button>
        </div>
      </header>

      <nav id="meetbar" class="meetbar" aria-label="Meeting">
        <button id="hand" type="button" aria-pressed="false">Raise hand</button>
        <div id="reactions" class="reactions" role="group" aria-label="Reactions"></div>
        <button id="people-toggle" type="button" aria-expanded="false" aria-controls="people">People</button>
        <button id="chat-jump" type="button" class="badge-button" hidden></button>
        <button id="approval-jump" type="button" class="badge-button warn" hidden></button>
      </nav>

      <section class="stage" aria-label="People and agents">
        <div id="notice" class="notice" hidden></div>
        <nav id="workspace-tabs" class="workspace-tabs" role="tablist" aria-label="Workspace"></nav>
        <div id="workspace-panes" class="workspace-panes"></div>
        <section id="people" class="people" aria-label="Participants" hidden></section>
        <!-- Jarvis: filled in by jarvis.js -->
        <section id="jarvis" class="jarvis" aria-label="Talk to an agent"></section>
        <div id="grid" class="grid"></div>
      </section>

      <aside class="chat" aria-label="Room chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="approvals" class="approvals"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message-input">Message the room</label>
          <textarea
            id="message-input"
            rows="2"
            maxlength="8000"
            placeholder="Message the room. Type @name to ask an agent."
          ></textarea>
          <button id="talk" type="button" aria-pressed="false" hidden>Talk</button>
          <button class="primary" type="submit">Send</button>
        </form>
      </aside>
    </div>
    <script src="vendor/livekit-client-2.22.4.umd.js"></script>
    <script src="app.js" type="module"></script>
    <script src="workspace.js" type="module"></script>
    <script src="meeting.js" type="module"></script>
    <script src="jarvis.js" type="module"></script>
    <script src="board.js" type="module"></script>
  </body>
</html>
